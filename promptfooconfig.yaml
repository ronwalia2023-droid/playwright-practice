prompts:
  - "You are an Air Canada bot. Answer: {{prompt}}"

providers:
  # This is a built-in Promptfoo mock that always passes
  - id: echo
    config:
      transform: "return 'I need to cancel my flight.'" 

tests:
  - vars:
      prompt: "I need to cancel my flight."
    assert:
      - type: contains
        value: "cancel"
